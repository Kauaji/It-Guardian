name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  JWT_SECRET: ci-only-secret-with-at-least-32-characters

jobs:
  static:
    name: Verificacoes estaticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run check:docs
      - run: npm run check:workflows
      - run: npm run check:contrast
      - run: npm run check:accents
      # Catraca de funcoes grandes: nenhuma funcao nova acima do limite.
      - run: node scripts/function-lengths.mjs --over 150 --fail-over 150 --fail-file 700 server/src client/src
      - run: node --test scripts/*.test.mjs

  server:
    name: Servidor (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [pg-mem, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: itguardian
          POSTGRES_PASSWORD: itguardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itguardian -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Cada arquivo de teste cria o proprio banco isolado quando TEST_PG_ADMIN_URL existe (ver ADR 0006).
      TEST_PG_ADMIN_URL: ${{ matrix.db == 'postgres' && 'postgres://itguardian:itguardian@127.0.0.1:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes com cobertura (catraca) no pg-mem
        if: matrix.db == 'pg-mem'
        run: npm run test:coverage
      - name: Testes de integracao no PostgreSQL real
        if: matrix.db == 'postgres'
        run: npm test
      - name: Migracoes aplicam do zero e o status zera
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgres://itguardian:itguardian@127.0.0.1:5432/postgres
        run: |
          npm run db:migrate
          npm run db:status -- --check

  client:
    name: Cliente (testes + cobertura + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:client:coverage
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  e2e:
    name: "E2E (Playwright - fluxos, CSP, acessibilidade)"
    runs-on: ubuntu-latest
    needs: [client]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7
